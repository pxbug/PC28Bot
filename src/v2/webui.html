<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>辣椒群管机器人Pro</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; background:#f0f4ff; color:#303236; min-height:100vh; }
.view { max-width: 720px; margin: 0 auto; padding: 28px 20px; }
.card { background:#fff; border-radius:14px; padding:20px 22px; box-shadow:0 2px 10px rgba(22,42,72,.06); margin-bottom:14px; }
h1 { font-size:22px; margin-bottom:6px; }
.sub { color:#6b7280; font-size:13px; margin-bottom:16px; }
label { display:block; font-size:13px; color:#6b7280; margin:12px 0 6px; }
input { width:100%; padding:11px 12px; border:1px solid #d6dee9; border-radius:10px; font-size:15px; outline:none; }
input:focus { border-color:#2563eb; }
.btn { width:100%; padding:12px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-size:16px; font-weight:600; cursor:pointer; margin-top:16px; }
.btn:hover { opacity:.9; }
.btn.secondary { background:#e5e9f0; color:#374151; }
.row { display:flex; gap:10px; align-items:center; }
.grow { flex:1; }
.status { margin-top:12px; color:#6b7280; font-size:13px; white-space:pre-line; }
.err { color:#dc2626; }
.dot { width:12px; height:12px; border-radius:50%; flex:0 0 12px; }
.dot.on { background:#22c55e; } .dot.off { background:#ef4444; }
.gcard { display:flex; align-items:center; gap:12px; }
.gname { font-size:15px; font-weight:600; flex:1; }
.gid { color:#9ca3af; font-size:12px; margin-right:14px; }
.remaining { font-size:14px; color:#2563eb; font-weight:600; white-space:nowrap; }
.empty { color:#9ca3af; text-align:center; margin-top:40px; font-size:15px; }
.footer { color:#9ca3af; font-size:12px; text-align:center; margin-top:16px; }
.modal { position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:center; justify-content:center; z-index:50; }
#captchaModal { z-index:60; }
.modal-box { background:#fff; border-radius:14px; padding:20px; width:420px; max-width:92vw; }
.hidden { display:none; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="view hidden">
  <h1>辣椒群管机器人Pro</h1>
  <div class="sub">登录机器人账号（一个机器人号可管理最多 30 个群）</div>
  <div class="card">
    <label>手机号</label>
    <input id="phone" placeholder="请输入手机号" autocomplete="off">
    <label>密码</label>
    <input id="password" type="password" placeholder="请输入密码">
    <button class="btn" onclick="doLogin()">登录</button>
    <div class="status" id="loginStatus"></div>
  </div>
</div>

<!-- 看板 -->
<div id="dashView" class="view hidden">
  <h1>辣椒群管机器人Pro</h1>
  <div class="sub" id="meta">加载中...</div>
  <div id="list"></div>
  <div class="footer">每 10 秒自动刷新 · 管理指令请在群内由超管发送</div>
</div>

<!-- 配置超管 -->
<div id="configView" class="view hidden">
  <h1>首次配置</h1>
  <div class="sub">请填写超级管理员的 userID（群内指令仅此账号生效）</div>
  <div class="card">
    <label>超级管理员 userID</label>
    <input id="saUid" placeholder="请输入超级管理员 userID">
    <button class="btn" onclick="saveSuperAdmin()">保存并进入</button>
    <div class="status" id="configStatus"></div>
  </div>
</div>

<!-- 验证码弹窗 -->
<div id="captchaModal" class="modal hidden">
  <div class="modal-box">
    <h3>安全验证</h3>
    <p style="font-size:13px;color:#666;margin:8px 0 12px">请完成下方验证</p>
    <div id="captchaBox" style="width:100%;min-height:170px;background:#fff;display:flex;align-items:center;justify-content:center;"></div>
    <div class="status" id="captchaStatus">加载中...</div>
  </div>
</div>

<!-- 短信弹窗 -->
<div id="smsModal" class="modal hidden">
  <div class="modal-box">
    <h3>设备切换验证</h3>
    <label>短信验证码</label>
    <div class="row">
      <input class="grow" id="smsCode" placeholder="请输入短信验证码">
      <button class="btn secondary" style="width:auto;margin:0" onclick="sendSms()">发送</button>
    </div>
    <button class="btn" onclick="submitSms()">确认登录</button>
    <div class="status" id="smsStatus"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle('hidden', !on);

async function doLogin() {
  const phone = $('phone').value.trim();
  const pwd = $('password').value;
  $('loginStatus').textContent = '登录中...';
  $('loginStatus').classList.remove('err');
  try {
    try { pywebview.api.log_js('doLogin: phone=' + phone); } catch(_) {}
    const r = await pywebview.api.login(phone, pwd);
    try { pywebview.api.log_js('login result=' + JSON.stringify(r)); } catch(_) {}
    if (r.ok) { await enterDashboard(); }
    else if (r.need_captcha) { openCaptcha(); }
    else if (r.need_sms) { openSms(); }
    else { $('loginStatus').classList.add('err'); $('loginStatus').textContent = r.error || '登录失败'; }
  } catch (e) { try { pywebview.api.log_js('doLogin err: ' + e); } catch(_) {} $('loginStatus').classList.add('err'); $('loginStatus').textContent = '登录失败：' + e; }
}

let captchaScriptLoaded = false;
let smsCaptchaPending = false;
function loadCaptchaScript() {
  return new Promise((resolve, reject) => {
    if (window.initAliyunCaptcha) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js';
    s.onload = () => { captchaScriptLoaded = true; resolve(); };
    s.onerror = () => reject(new Error('验证码脚本加载失败'));
    document.head.appendChild(s);
  });
}

async function openCaptcha() {
  show('captchaModal', true);
  $('captchaStatus').textContent = '加载中...';
  $('captchaStatus').classList.remove('err');
  try {
    const c = await pywebview.api.get_captcha();
    if (!c.ok) { $('captchaStatus').classList.add('err'); $('captchaStatus').textContent = c.error; return; }
    await loadCaptchaScript();
    $('captchaBox').innerHTML = '<div id="aliyun-captcha-element" style="margin:0 auto;width:340px"></div>';
    window.AliyunCaptchaConfig = { region: c.region || '', prefix: c.prefix || '' };
    window.initAliyunCaptcha({
      SceneId: c.scene_id || '',
      mode: 'embed',
      element: '#aliyun-captcha-element',
      slideStyle: { width: 340, height: 42 },
      language: 'cn',
      success: async function(e) {
        const v = String(e || '');
        try { pywebview.api.log_js('captcha success, len=' + v.length); } catch(_) {}
        if (smsCaptchaPending) {
          smsCaptchaPending = false;
          $('captchaStatus').textContent = '验证通过，发送短信中...';
          try {
            const r = await pywebview.api.send_sms(v);
            try { pywebview.api.log_js('send_sms(captcha) -> ' + JSON.stringify(r)); } catch(_) {}
            if (r.ok) { show('captchaModal', false); openSms(); $('smsStatus').textContent='已发送，请查收'; }
            else { $('captchaStatus').classList.add('err'); $('captchaStatus').textContent = r.error || '发送失败'; }
          } catch(err) { try { pywebview.api.log_js('send_sms err: ' + err); } catch(_) {} $('captchaStatus').classList.add('err'); $('captchaStatus').textContent = '发送失败：' + err; }
          return;
        }
        $('captchaStatus').textContent = '验证通过，登录中...';
        try {
          const r = await pywebview.api.submit_captcha(v);
          try { pywebview.api.log_js('submit_captcha -> ' + JSON.stringify(r)); } catch(_) {}
          if (r.ok) { show('captchaModal', false); await enterDashboard(); }
          else if (r.need_sms) { show('captchaModal', false); openSms(); }
          else { $('captchaStatus').classList.add('err'); $('captchaStatus').textContent = r.error || '验证未通过'; }
        } catch(err) { try { pywebview.api.log_js('submit err: ' + err); } catch(_) {} $('captchaStatus').classList.add('err'); $('captchaStatus').textContent = '登录失败：' + err; }
      },
      fail: function() { $('captchaStatus').classList.add('err'); $('captchaStatus').textContent = '验证失败，请重试'; },
      getInstance: function(e) { setTimeout(function(){ typeof e.show === 'function' ? e.show() : ''; }, 200); }
    });
  } catch(e) { $('captchaStatus').classList.add('err'); $('captchaStatus').textContent = '验证码加载失败：' + e; }
}

function openSms() { show('smsModal', true); $('smsStatus').textContent=''; }
async function sendSms() {
  $('smsStatus').textContent='发送中...';
  $('smsStatus').classList.remove('err');
  try {
    const r = await pywebview.api.send_sms();
    if (r.ok) $('smsStatus').textContent = '已发送，请查收';
    else if (r.need_captcha) {
      smsCaptchaPending = true;
      $('smsStatus').textContent = '需要安全验证，请完成滑块...';
      openCaptcha();
    }
    else { $('smsStatus').classList.add('err'); $('smsStatus').textContent = r.error || '发送失败'; }
  } catch(e) { $('smsStatus').classList.add('err'); $('smsStatus').textContent = '发送失败：' + e; }
}
async function submitSms() {
  const code = $('smsCode').value.trim();
  $('smsStatus').textContent='登录中...';
  const r = await pywebview.api.submit_sms(code);
  if (r.ok) { show('smsModal', false); await enterDashboard(); }
  else $('smsStatus').textContent = r.error || '登录失败';
}

async function saveSuperAdmin() {
  const uid = $('saUid').value.trim();
  $('configStatus').textContent = '保存中...';
  const r = await pywebview.api.set_super_admin(uid);
  if (r.ok) { await enterDashboard(); }
  else { $('configStatus').classList.add('err'); $('configStatus').textContent = '保存失败'; }
}

async function enterDashboard() {
  show('loginView', false); show('configView', false);
  await load();
  show('dashView', true);
}

async function load() {
  try {
    const d = await pywebview.api.get_dashboard();
    if (d.need_login) { show('dashView', false); show('loginView', true); return; }
    if (!d.super_admins || !d.super_admins.length) {
      show('dashView', false); show('configView', true); return;
    }
    $('meta').textContent = '登录账号：' + d.user_id + ' ｜ 超管：' + d.super_admins.join(',');
    if (!d.groups.length) { $('list').innerHTML = '<div class="empty">暂无已加入的群</div>'; return; }
    $('list').innerHTML = d.groups.map(g => `
      <div class="card gcard">
        <div class="dot ${g.enabled?'on':'off'}"></div>
        <div class="gname">${g.gname}</div>
        <div class="gid">${g.gid}</div>
        <div class="remaining">${g.enabled ? '🟢 '+g.remaining : '🔴 已停用'}</div>
      </div>`).join('');
  } catch(e) { $('meta').textContent = '加载失败：' + e; }
}

async function init() {
  try {
    const s = await pywebview.api.get_login_state();
    if (s.logged_in) { await enterDashboard(); }
    else { show('loginView', true); }
  } catch(e) {
    show('loginView', true);
    $('loginStatus').textContent = '初始化失败：' + e;
    try { pywebview.api.log_js('init error: ' + e); } catch(_) {}
  }
  // 预加载验证码脚本，减少滑块等待
  loadCaptchaScript().catch(function(){});
  // 看板每 10 秒自动刷新（群启停状态实时更新）
  setInterval(function() {
    try {
      if (!$('dashView').classList.contains('hidden')) { load(); }
    } catch(e) {}
  }, 10000);
}

function runInit() {
  if (window.pywebview && window.pywebview.api) { init(); }
  else { window.addEventListener('pywebviewready', function(){ init(); }); }
}
runInit();
</script>
</body>
</html>
