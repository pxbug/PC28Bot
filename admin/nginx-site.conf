server
{
    listen 80;
    server_name 154.36.188.150;
    index index.php index.html index.htm default.php default.htm default.html;
    root D:/wwwroot/154.36.188.150;
    include D:/BtSoft/nginx/conf/vhost/extension/154.36.188.150/*.conf;

    #START-ERROR-PAGE
    #error_page 403 /403.html;
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #END-ERROR-PAGE

    #HTTP_TO_HTTPS_START
    #HTTP_TO_HTTPS_END

    #LIMIT_INFO_START
    #LIMIT_INFO_END

    #SSL-INFO-START
    #SSL-INFO-END

    #proxy-cache
    location ~ /purge(/.*) {
        proxy_cache_purge cache_one $1$is_args$args;
    }
    #proxy
    include proxy/154.36.188.150/*.conf;

    #PHP-INFO-START
    include php/74.conf;
    #PHP-INFO-END

    #REWRITE-START
    include rewrite/154.36.188.150/*.conf;
    #END-REWRITE-START

    # 静态资源：直接读取 public/ 下的文件
    location ~ ^/css/ {
        try_files $uri /public$uri =404;
    }
    location ~ ^/js/ {
        try_files $uri /public$uri =404;
    }
    location ~ ^/assets/ {
        try_files $uri /public$uri =404;
    }

    # 禁止直接访问 src/
    location ^~ /src/ {
        return 404;
    }

    # 路由：所有请求（GET+POST）统一打到 public/index.php
    location / {
        try_files $uri $uri/ /public/index.php?$query_string;
    }

    #redirect
    include redirect/154.36.188.150/*.conf;

    #access forbidden
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md){
        return 404;
    }

    #ssl
    location ~ \.well-known{
        allow all;
    }

    #static-cache
    include static_cache/154.36.188.150/*.conf;

    access_log  D:/BtSoft/wwwlogs/154.36.188.150.log;
    error_log  D:/BtSoft/wwwlogs/154.36.188.150.error.log;
}
